name: repro-1338
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --example repro_1338
      - shell: bash
        run: |
          mkdir out
          cp target/release/examples/repro_1338.exe out/
          printf '@echo off\r\necho === set_minimized (tao) ===\r\nrepro_1338.exe tao\r\npause\r\n' > out/1-tao.bat
          printf '@echo off\r\necho === WM_SYSCOMMAND ===\r\nrepro_1338.exe syscmd\r\npause\r\n' > out/2-syscmd.bat
      - uses: actions/upload-artifact@v4
        with:
          name: repro-1338-windows
          path: out/
